[project]
name = "okxquant"
version = "0.1.0"
description = "OKX BTC 量化交易命令行工具（仅模拟盘）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "python-okx==0.4.5",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
okxquant = "okxquant.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/okxquant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "strategies"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
