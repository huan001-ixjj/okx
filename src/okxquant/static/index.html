<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>okxquant 看板</title>
<style>
  :root {
    --bg: #080d18;
    --panel: #111a2e;
    --line: #1f2c47;
    --text: #e7edfa;
    --dim: #8e9cbb;
    --teal: #2dd4bf;
    --up: #34d399;
    --down: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px clamp(16px, 4vw, 40px) 48px;
    background:
      radial-gradient(1200px 500px at 12% -10%, rgba(45, 212, 191, .10), transparent 60%),
      radial-gradient(900px 400px at 90% 0%, rgba(99, 102, 241, .12), transparent 55%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  h1, h2 { margin: 0; font-weight: 600; }
  h1 { font-size: 17px; letter-spacing: .04em; }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  header.top {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; margin-bottom: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { color: var(--teal); font-size: 18px; }
  .tag {
    padding: 2px 8px; border-radius: 999px; font-size: 11px; letter-spacing: .06em;
    border: 1px solid var(--line); color: var(--dim); background: rgba(255,255,255,.02);
  }
  .tag.simulated { color: var(--teal); border-color: rgba(45,212,191,.4); }
  .tag.live { color: var(--down); border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.08); }
  .toolbar { display: flex; align-items: center; gap: 14px; color: var(--dim); font-size: 12px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .toolbar input[type="checkbox"] { accent-color: var(--teal); width: 14px; height: 14px; margin: 0; }
  #instBadge { font-variant-numeric: tabular-nums; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 16px; }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 10px 30px -20px rgba(0,0,0,.9);
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }

  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.on { color: #06231f; background: var(--teal); border-color: var(--teal); font-weight: 600; }
  .pill.off { color: var(--dim); }
  .pill.bad { color: var(--down); border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.08); }

  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px 18px; }
  .kv > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .kv span { color: var(--dim); font-size: 11.5px; letter-spacing: .03em; }
  .kv b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv b.small { font-size: 13px; font-weight: 500; white-space: normal; overflow-wrap: anywhere; }

  .note {
    margin: 12px 0 0; font-size: 12px; color: var(--dim); min-height: 18px;
    overflow-wrap: anywhere;
  }
  .note.err { color: var(--down); }

  .btn {
    appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--text); border-radius: 9px; padding: 8px 14px; font-size: 13px;
    cursor: pointer; transition: .15s ease; font-family: inherit;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }

  .up { color: var(--up); }
  .down { color: var(--down); }
  .dim { color: var(--dim); }

  #chartWrap { position: relative; height: 190px; }
  #chartWrap svg { width: 100%; height: 100%; display: block; }
  .empty {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--dim); font-size: 12.5px; text-align: center; padding: 0 20px;
  }

  .table-wrap { overflow-x: auto; margin: -4px -4px 0; padding: 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 10px; white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid rgba(31,44,71,.55); }
  tbody tr:last-child { border-bottom: 0; }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  td.empty-cell { text-align: center; color: var(--dim); padding: 18px 10px; }

  pre.logs {
    margin: 0; max-height: 260px; overflow: auto; font-size: 12px; line-height: 1.6;
    color: #b9c6e2; background: #0a1222; border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  pre.logs:empty::after { content: "暂无日志"; color: var(--dim); }

  @media (max-width: 520px) {
    body { padding: 16px 14px 32px; }
    .toolbar { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="logo">◆</span>
    <h1>okxquant</h1>
    <span id="envTag" class="tag">—</span>
  </div>
  <div class="toolbar">
    <span id="instBadge">—</span>
    <label><input type="checkbox" id="autoRefresh" checked> 自动刷新 5s</label>
    <button id="btnRefresh" class="btn">刷新</button>
    <span id="updatedAt">—</span>
  </div>
</header>

<main>
  <section class="grid">
    <article class="card">
      <div class="card-head">
        <h2>引擎</h2>
        <span id="enginePill" class="pill off">—</span>
      </div>
      <div class="kv">
        <div><span>进程 PID</span><b id="engPid">—</b></div>
        <div><span>重启次数</span><b id="engRestarts">0</b></div>
        <div><span>最近退出码</span><b id="engExit">—</b></div>
        <div><span>下次重试</span><b id="engRetry">—</b></div>
      </div>
      <p id="engMsg" class="note"></p>
      <p class="note dim" style="margin-top:6px;">引擎由服务端托管，看板只读，不提供启停与下单操作。</p>
    </article>

    <article class="card">
      <div class="card-head">
        <h2>最新运行</h2>
        <span id="runPill" class="pill off">—</span>
      </div>
      <div class="kv">
        <div><span>策略</span><b id="runStrategy" class="small">—</b></div>
        <div><span>交易对 / 周期</span><b id="runMarket" class="small">—</b></div>
        <div><span>当前权益</span><b id="runEquity">—</b></div>
        <div><span>累计收益</span><b id="runReturn">—</b></div>
        <div><span>胜率</span><b id="runWinRate">—</b></div>
        <div><span>成交笔数</span><b id="runTrades">—</b></div>
        <div><span>已处理 K 线</span><b id="runBars">—</b></div>
        <div><span>运行 ID</span><b id="runId" class="small">—</b></div>
      </div>
      <p id="runMsg" class="note"></p>
    </article>
  </section>

  <article class="card" style="margin-bottom:16px;">
    <div class="card-head">
      <h2>权益曲线</h2>
      <span id="chartMeta" class="pill off">—</span>
    </div>
    <div id="chartWrap"><div class="empty">暂无权益采样点</div></div>
  </article>

  <section class="grid two">
    <article class="card">
      <div class="card-head"><h2>成交明细</h2><span id="tradesMeta" class="pill off">—</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>方向</th><th>数量</th><th>价格</th><th>手续费</th></tr></thead>
          <tbody id="tradesBody"><tr><td class="empty-cell" colspan="5">暂无成交</td></tr></tbody>
        </table>
      </div>
    </article>

    <article class="card">
      <div class="card-head"><h2>订单</h2><span id="ordersMeta" class="pill off">—</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>方向</th><th>类型</th><th>数量</th><th>价格</th><th>状态</th></tr></thead>
          <tbody id="ordersBody"><tr><td class="empty-cell" colspan="6">暂无订单</td></tr></tbody>
        </table>
      </div>
    </article>
  </section>

  <article class="card" style="margin-top:16px;">
    <div class="card-head"><h2>引擎日志</h2><span id="logsMeta" class="pill off">—</span></div>
    <pre id="logs" class="logs"></pre>
  </article>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const INTERVAL = 5000;
  const RUN_STATUS = { running: "运行中", finished: "已结束", halted: "已熔断", failed: "失败" };
  const ORDER_STATUS = {
    pending: "待提交", live: "挂单中", partially_filled: "部分成交",
    filled: "已成交", canceled: "已撤销", stale: "失效",
  };
  let timer = null;

  const isNum = (v) => typeof v === "number" && Number.isFinite(v);
  const fmtMoney = (v) => (isNum(v) ? v.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—");
  const fmtQty = (v) => (isNum(v) ? v.toLocaleString("zh-CN", { maximumFractionDigits: 8 }) : "—");
  const fmtPrice = (v) => (isNum(v) ? v.toLocaleString("zh-CN", { maximumFractionDigits: 8 }) : "—");
  const fmtFee = (v) => (isNum(v) ? v.toLocaleString("zh-CN", { maximumFractionDigits: 6 }) : "—");
  const fmtPct = (v) => (isNum(v) ? (v > 0 ? "+" : "") + (v * 100).toFixed(2) + "%" : "—");
  const fmtInt = (v) => (isNum(v) ? String(Math.round(v)) : "—");
  const fmtTime = (ts) => {
    if (!ts) return "—";
    const d = new Date(ts);
    return d.toLocaleString("zh-CN", {
      hour12: false, month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit",
    });
  };
  const pnlClass = (v) => (isNum(v) && v > 0 ? "up" : isNum(v) && v < 0 ? "down" : "");

  function pill(el, text, kind) {
    el.textContent = text;
    el.className = "pill " + (kind || "off");
  }

  function renderStatus(s) {
    const env = s.environment || "SIMULATED";
    const tag = $("envTag");
    tag.textContent = env === "LIVE" ? "LIVE TRADING" : "SIMULATED";
    tag.className = "tag " + (env === "LIVE" ? "live" : "simulated");
    $("instBadge").textContent = `${s.inst_id || "—"} · ${s.bar || "—"}`;

    const eng = s.engine || {};
    const running = !!eng.running;
    if (running) pill($("enginePill"), "运行中", "on");
    else if (eng.blocked) pill($("enginePill"), "已阻塞", "bad");
    else pill($("enginePill"), "已停止", "off");

    $("engPid").textContent = eng.pid ? String(eng.pid) : "—";
    $("engRestarts").textContent = String(eng.restarts ?? 0);
    $("engExit").textContent = eng.last_exit_code === null || eng.last_exit_code === undefined ? "—" : String(eng.last_exit_code);
    $("engRetry").textContent = eng.next_retry_sec > 0 ? `${eng.next_retry_sec}s` : "—";

    const msg = eng.blocked || eng.message || "";
    $("engMsg").textContent = msg;
    $("engMsg").className = "note" + (eng.blocked ? " err" : "");

    const run = s.run;
    if (!run) {
      pill($("runPill"), "无记录", "off");
      ["runStrategy", "runMarket", "runEquity", "runReturn", "runWinRate", "runTrades", "runBars", "runId"]
        .forEach((id) => { $(id).textContent = "—"; $(id).className = id === "runStrategy" || id === "runMarket" || id === "runId" ? "small" : ""; });
      $("runMsg").textContent = running ? "引擎已启动，等待首笔运行记录写入…" : "引擎尚未运行。";
      $("runMsg").className = "note";
      return;
    }

    const st = RUN_STATUS[run.status] || run.status || "—";
    pill($("runPill"), st, run.status === "halted" ? "bad" : run.status === "running" ? "on" : "off");
    $("runStrategy").textContent = run.strategy || "—";
    $("runMarket").textContent = `${run.inst_id || "—"} · ${run.bar || "—"}`;
    $("runEquity").textContent = fmtMoney(run.final_equity);
    const ret = run.total_return;
    $("runReturn").textContent = fmtPct(ret);
    $("runReturn").className = pnlClass(ret);
    $("runWinRate").textContent = fmtPct(run.win_rate);
    $("runTrades").textContent = fmtInt(run.trade_count);
    $("runBars").textContent = fmtInt(run.bars);
    $("runId").textContent = run.run_id ? `#${run.run_id}` : "—";
    $("runMsg").textContent = run.status === "halted" ? "风控已熔断，进程内不会自动恢复。" : "";
    $("runMsg").className = "note" + (run.status === "halted" ? " err" : "");
  }

  function renderChart(payload) {
    const wrap = $("chartWrap");
    const points = (payload && payload.points) || [];
    if (points.length < 2) {
      wrap.innerHTML = '<div class="empty">暂无权益采样点（引擎按配置的采样间隔落库）</div>';
      pill($("chartMeta"), points.length ? `${points.length} 点` : "无数据", "off");
      return;
    }
    const values = points.map((p) => p.equity);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const first = values[0];
    const last = values[values.length - 1];
    const delta = first > 0 ? (last / first - 1) : 0;
    pill($("chartMeta"), `${points.length} 点 · ${fmtMoney(min)} ~ ${fmtMoney(max)} · ${fmtPct(delta)}`, "off");

    const W = 760, H = 190, PAD = 10;
    const span = max - min || 1;
    const x = (i) => PAD + (i * (W - 2 * PAD)) / (points.length - 1);
    const y = (v) => H - PAD - ((v - min) / span) * (H - 2 * PAD);
    const line = values.map((v, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const area = `${line} L${x(values.length - 1).toFixed(1)},${H - PAD} L${x(0).toFixed(1)},${H - PAD} Z`;
    const baseY = y(first).toFixed(1);
    const stroke = last >= first ? "#34d399" : "#f87171";

    wrap.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="权益曲线">
        <defs>
          <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${stroke}" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="${PAD}" y1="${baseY}" x2="${W - PAD}" y2="${baseY}"
              stroke="#3a4560" stroke-width="1" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
        <path d="${area}" fill="url(#eqFill)"/>
        <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  function fillTable(tbody, rows, colspan, renderRow) {
    tbody.replaceChildren();
    if (!rows.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.className = "empty-cell";
      td.colSpan = colspan;
      td.textContent = "暂无数据";
      tr.append(td);
      tbody.append(tr);
      return;
    }
    for (const row of rows) {
      const tr = document.createElement("tr");
      renderRow(tr, row);
      tbody.append(tr);
    }
  }

  function cell(tr, text, className) {
    const td = document.createElement("td");
    td.textContent = text;
    if (className) td.className = className;
    tr.append(td);
  }

  function renderTrades(payload) {
    const rows = (payload && payload.trades) || [];
    pill($("tradesMeta"), rows.length ? `${rows.length} 笔` : "无", "off");
    fillTable($("tradesBody"), rows, 5, (tr, t) => {
      const buy = t.side === "buy";
      cell(tr, fmtTime(t.ts));
      cell(tr, buy ? "买入" : "卖出", buy ? "up" : "down");
      cell(tr, fmtQty(t.qty));
      cell(tr, fmtPrice(t.px));
      cell(tr, fmtFee(t.fee), "dim");
    });
  }

  function renderOrders(payload) {
    const rows = (payload && payload.orders) || [];
    const open = rows.filter((o) => ["pending", "live", "partially_filled"].includes(o.status)).length;
    pill($("ordersMeta"), rows.length ? `${rows.length} 笔 · 未结 ${open}` : "无", "off");
    fillTable($("ordersBody"), rows, 6, (tr, o) => {
      const buy = o.side === "buy";
      cell(tr, fmtTime(o.created_ts));
      cell(tr, buy ? "买入" : "卖出", buy ? "up" : "down");
      cell(tr, o.ord_type === "market" ? "市价" : "限价", "dim");
      cell(tr, fmtQty(o.filled_qty > 0 ? o.filled_qty : o.qty));
      cell(tr, o.px ? fmtPrice(o.px) : "市价");
      cell(tr, ORDER_STATUS[o.status] || o.status || "—", o.status === "stale" ? "down" : "dim");
    });
  }

  function renderLogs(payload) {
    const lines = (payload && payload.lines) || [];
    const pre = $("logs");
    pre.textContent = lines.join("\n");
    pre.scrollTop = pre.scrollHeight;
    pill($("logsMeta"), lines.length ? `尾部 ${lines.length} 行` : "无", "off");
  }

  async function getJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`${url} → ${res.status}`);
    return res.json();
  }

  async function refresh() {
    const stamp = $("updatedAt");
    try {
      const [status, trades, equity, orders, logs] = await Promise.all([
        getJSON("/status"),
        getJSON("/trades?limit=50").catch(() => null),
        getJSON("/equity?limit=400").catch(() => null),
        getJSON("/orders?limit=50").catch(() => null),
        getJSON("/logs?limit=60").catch(() => null),
      ]);
      renderStatus(status);
      renderTrades(trades);
      renderChart(equity);
      renderOrders(orders);
      renderLogs(logs);
      stamp.textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
      stamp.className = "";
    } catch (err) {
      stamp.textContent = "接口不可达：" + err.message;
      stamp.className = "down";
    }
  }

  function schedule() {
    if (timer) clearInterval(timer);
    timer = null;
    if (!$("autoRefresh").checked) return;
    timer = setInterval(() => { if (!document.hidden) refresh(); }, INTERVAL);
  }

  $("autoRefresh").addEventListener("change", schedule);
  $("btnRefresh").addEventListener("click", refresh);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  refresh();
  schedule();
})();
</script>
</body>
</html>
